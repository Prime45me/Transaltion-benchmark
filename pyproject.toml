[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twi-translation-lab"
version = "0.1.0"
description = "Asante Twi Translation Benchmark Lab for children's stories"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Translation Research Team" }
]
keywords = ["machine-translation", "twi", "asante-twi", "benchmark", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
]
# Phase 2: HTTP client for Khaya API (installed)
phase2 = [
    "requests>=2.31.0,<3.0.0",
]
# Phase 2: OPUS-MT local inference (large download — install explicitly)
# pip install -e ".[phase2-opus]"  then  python -m twi_lab.engines.opus_mt --download
phase2-opus = [
    "transformers>=4.40.0,<5.0.0",
    "sentencepiece>=0.1.99",
    "torch>=2.0.0",
]

[project.scripts]
twi-validate = "twi_lab.dataset:cli"
twi-run = "twi_lab.runner:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
